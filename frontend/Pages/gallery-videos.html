<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos Gallery | Awadh Aviation Academy</title>
  <meta name="description" content="Watch training videos, drone flight tests, and aircraft mechanical workshop tours at Awadh Aviation Academy.">
  <link rel="stylesheet" href="../Assets/Styles/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="../Assets/Styles/style.css">
  <link rel="stylesheet" href="../Assets/Styles/responsive.css">
</head>
<body class="m-0 p-0 no-scroll bg-white">

  <div id="preloader-container"></div>
  <div id="header-container"></div>

  <!-- Breadcrumb -->
  <section class="bg-gray-100 pt-36 pb-6 px-6 md:px-14 border-b">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between">
      <div>
        
</div>
      
    </div>
  </section>

  <!-- Video Grid Section -->
  <section class="pt-10 pb-20 px-6 md:px-12 bg-white">
    <div class="max-w-7xl mx-auto">
      <h1 class="mb-6 tracking-tight text-4xl md:text-5xl font-extrabold text-gray-800">Videos Gallery</h1>

      <!-- Empty State -->
      <div class="text-center py-20">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
          <i class="fas fa-video text-gray-400 text-4xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-700 mb-3">Videos Coming Soon</h2>
        <p class="text-gray-500 max-w-md mx-auto">We're updating our video gallery with the latest footage from our training sessions, drone flights, and workshops. Check back soon!</p>
      </div>

    </div>
  </section>

  <div id="footer-container"></div>

  <!-- Cookie Banner -->
  <div id="cookieBanner" class="hidden flex flex-col sm:flex-row justify-between items-center text-gray-800">
    <p class="text-sm text-center sm:text-left mb-3 sm:mb-0">
      This website stores cookies on your computer. To find out more, see our
      <a href="#" class="text-orange-500 font-semibold hover:underline">Privacy Policy</a>.
    </p>
    <div class="flex gap-3">
      <button id="declineCookies" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm">
        Decline
      </button>
      <button id="acceptCookies" class="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition text-sm">
        Accept
      </button>
    </div>
  </div>

  <button id="scrollTopBtn" class="hidden">
    <i class="fas fa-arrow-up text-xl"></i>
  </button>

  <script src="../Assets/Script/components.js?v=5"></script>
  <script src="../Assets/Script/preloader.js?v=5"></script>
  <script src="../Assets/Script/scroll.js?v=5"></script>
  <script src="../Assets/Script/video.js?v=5"></script>
  <script src="../Assets/Script/cookie.js?v=5"></script>
  <script src="../Assets/Script/script.js?v=5"></script>


</body></html>
